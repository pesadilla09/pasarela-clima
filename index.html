<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";
    const horaCorte = hora.substring(0, 2) + ":00:00"; 

    // Estructura base de datos por defecto de contingencia segura
    let resultado = {
        municipio: "Águilas",
        provincia: "Murcia",
        temp: 21.2,
        hum: 62,
        wind: 14.5,
        wbgt: 19
    };

    // 1. Consulta Geográfica
    const urlGeo = `https://open-meteo.com{lat.toFixed(4)}&longitude=${lon.toFixed(4)}&language=es&format=json`;
    
    fetch(urlGeo)
        .then(res => res.json())
        .then(geoData => {
            if (geoData && geoData.results && geoData.results.length > 0) {
                resultado.municipio = geoData.results[0].name || "Zona Rural";
                resultado.provincia = geoData.results[0].admin1 || "";
            }
            return fetch("https://visualcrossing.com" + lat.toFixed(4) + "," + lon.toFixed(4) + "/" + fecha + "/" + fecha + "?unitGroup=metric&include=hours&key=FREE_ACCESS_KEY&contentType=json");
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.days && data.days[0] && data.days[0].hours) {
                const hours = data.days[0].hours;
                let hourRow = hours.find(h => h.datetime === horaCorte) || hours[17];
                if (hourRow) {
                    resultado.temp = hourRow.temp;
                    resultado.hum = hourRow.humidity;
                    resultado.wind = Math.round(hourRow.windspeed);
                    resultado.wbgt = Math.round((hourRow.temp * 0.7) + (hourRow.temp * (hourRow.humidity / 100) * 0.3));
                }
            }
            window.parent.postMessage(resultado, "*");
        })
        .catch(() => {
            window.parent.postMessage(resultado, "*");
        });
})();
</script>
</body>
</html>
