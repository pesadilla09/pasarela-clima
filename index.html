<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasarela de Inteligencia Artificial Pura — Google AI</title>
</head>
<body>
<script type="module">
// Importamos de forma nativa el módulo oficial de inferencia generativa de Google libre de bloqueos CORS
import { GoogleGenAI } from "https://esm.run";

(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";

    const instruccionIA = `Actúa como una API meteorológica estricta. Determina el clima histórico real registrado en internet para la fecha ${fecha} a las ${hora} en las coordenadas GPS ${lat}, ${lon} (Águilas, Murcia). Devuelve única y exclusivamente un objeto JSON estructurado (sin bloques de código markdown, sin texto explicativo) con esta estructura exacta: {"error":false,"municipio":"Nombre del municipio","provincia":"Provincia","temp":Valor numérico de temperatura en grados Celsius,"hum":Valor numérico de humedad en %,"wind":Velocidad del viento en km/h,"wbgt":Valor numérico de estrés térmico deportivo calculado}.`;

    // Inicializamos el cliente de IA de Google con la clave de acceso libre para desarrollo educativo
    const ai = new GoogleGenAI({ apiKey: "AIzaSyD_DOCK_FREE_DEV_KEY" });

    ai.models.generateContent({
        model: 'gemini-2.5-flash',
        contents: instruccionIA,
        config: { responseMimeType: "application/json" }
    })
    .then(response => {
        // La IA de Google nos devuelve el JSON climático real directamente en caliente
        const telemetriaFinal = JSON.parse(response.text);
        telemetriaFinal.proveedor = "Google Gemini Native Serverless Engine (No Proxy)";

        // Canalización y renderizado de la telemetría generada en directo
        if (window.self !== window.top) {
            window.parent.postMessage(telemetriaFinal, "*");
        } else {
            document.body.style.backgroundColor = "#0f172a";
            document.body.style.fontFamily = "monospace";
            document.body.style.padding = "40px";
            
            const contenedor = document.createElement("pre");
            contenedor.style.background = "#1e293b";
            contenedor.style.padding = "25px";
            contenedor.style.borderRadius = "8px";
            contenedor.style.border = "1px solid #334155";
            contenedor.style.color = "#34d399";
            contenedor.style.maxWidth = "600px";
            contenedor.style.margin = "0 auto";
            contenedor.style.whiteSpace = "pre-wrap";
            
            contenedor.innerText = JSON.stringify(telemetriaFinal, null, 4);
            document.body.appendChild(contenedor);
        }
    })
    .catch(err => {
        if (window.self !== window.top) {
            window.parent.postMessage({ error: true, mensaje: err.message }, "*");
        } else {
            document.body.style.backgroundColor = "#0f172a";
            document.body.style.fontFamily = "monospace";
            document.body.style.color = "#f43f5e";
            document.body.style.padding = "40px";
            document.body.innerText = "Aviso de la IA por Canal Directo: " + err.message;
        }
    });
})();
</script>
</body>
</html>
