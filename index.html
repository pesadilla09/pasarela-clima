<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasarela de Clima Real — RunningLab</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #38bdf8; margin: 0; padding: 20px; font-size: 14px; }
        .grid-clima { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; max-width: 700px; margin: 0 auto; }
        .forma-box { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .forma-box span { display: block; color: #94a3b8; font-size: 0.85em; text-transform: uppercase; font-weight: bold; }
        .forma-box strong { display: block; color: #f8fafc; font-size: 1.25em; margin-top: 4px; font-weight: 600; }
        .success-text { color: #34d399 !important; }
        .error-text { color: #f43f5e !important; }
    </style>
</head>
<body>

<div class="grid-clima">
    <div class="forma-box"><span>📍 Ubicación Satélite</span><strong id="localidad" class="success-text">Buscando...</strong></div>
    <div class="forma-box"><span>Real Satélite Weather</span><strong id="temp">Conectando...</strong></div>
    <div class="forma-box"><span>Real Hum / Wind</span><strong id="wind">Conectando...</strong></div>
    <div class="forma-box"><span>Estrés Fisiológico WBGT</span><strong id="wbgt">-- °C</strong></div>
</div>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    
    // Parámetros geográficos dinámicos (Águilas por defecto si entras a secas)
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";

    const targetTimestamp = fecha + "T" + hora.substring(0, 2) + ":00";
    let resultado = { error: false, municipio: "Águilas", provincia: "Murcia", temp: "--", hum: "--", wind: "--", wbgt: "--" };

    // Construcción de la URL de Open-Meteo apuntando a sus servidores de datos consolidados
    const urlClimaOriginal = "https://open-meteo.com" + lat.toFixed(4) + "&longitude=" + lon.toFixed(4) + "&start_date=" + fecha + "&end_date=" + fecha + "&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=Europe%2FMadrid";
    
    // Envolvemos la petición en corsproxy.io para saltar el bloqueo perimetral de red de forma 100% limpia
    const urlFinal = "https://corsproxy.io?" + encodeURIComponent(urlClimaOriginal);

    fetch(urlFinal)
        .then(res => {
            if (!res.ok) throw new Error("Fallo en pasarela de datos");
            return res.json();
        })
        .then(data => {
            if (data && data.hourly && data.hourly.time) {
                const idx = data.hourly.time.indexOf(targetTimestamp);
                
                if (idx !== -1) {
                    resultado.temp = data.hourly.temperature_2m[idx];
                    resultado.hum = data.hourly.relative_humidity_2m[idx];
                    resultado.wind = Math.round(data.hourly.wind_speed_10m[idx]);
                    resultado.wbgt = Math.round((resultado.temp * 0.7) + (resultado.temp * (resultado.hum / 100) * 0.3));

                    // Inyección real descargada de internet en pantalla
                    document.getElementById('localidad').innerText = resultado.municipio + " (" + resultado.provincia + ")";
                    document.getElementById('temp').innerText = resultado.temp + " °C";
                    document.getElementById('wind').innerText = resultado.hum + "% — " + resultado.wind + " km/h";
                    document.getElementById('wbgt').innerText = resultado.wbgt + " °C";
                    
                    // Transmitimos los datos reales a tu InfinityFree
                    window.parent.postMessage(resultado, "*");
                } else {
                    document.getElementById('temp').innerText = "Hora no consolidada";
                }
            }
        })
        .catch(err => {
            document.getElementById('temp').innerText = "Satélite ocupado";
            document.getElementById('temp').classList.add('error-text');
        });
})();
</script>
</body>
</html>
