<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #38bdf8; margin: 0; padding: 0; font-size: 14px; }
        .grid-clima { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        .forma-box { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .forma-box span { display: block; color: #94a3b8; font-size: 0.85em; text-transform: uppercase; font-weight: bold; }
        .forma-box strong { display: block; color: #f8fafc; font-size: 1.2em; margin-top: 4px; font-weight: 600; }
        .success-text { color: #34d399 !important; }
    </style>
</head>
<body>

<div class="grid-clima">
    <div class="forma-box"><span>📍 Ubicación Satélite</span><strong id="localidad" class="success-text">Buscando...</strong></div>
    <div class="forma-box"><span>Real Satélite Weather</span><strong id="temp">Conectando...</strong></div>
    <div class="forma-box"><span>Real Hum / Wind</span><strong id="wind">Conectando...</strong></div>
    <div class="forma-box"><span>Estrés Fisiológico WBGT</span><strong id="wbgt">-- °C</strong></div>
</div>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";
    const horaCorte = hora.substring(0, 2) + ":00:00"; 

    // 1. RECONOCIMIENTO GEOGRÁFICO DE MUNICIPIO AUTOMÁTICO
    const urlGeo = `https://open-meteo.com{lat.toFixed(4)}&longitude=${lon.toFixed(4)}&language=es&format=json`;

    fetch(urlGeo)
        .then(res => res.json())
        .then(geoData => {
            if (geoData && geoData.results && geoData.results.length > 0) {
                const lugar = geoData.results[0];
                const municipio = lugar.name || "Zona Rural";
                const provincia = lugar.admin1 || "";
                document.getElementById('localidad').innerText = municipio + " (" + provincia + ")";
            } else {
                document.getElementById('localidad').innerText = "Coordenadas GPS";
            }
        })
        .catch(() => { document.getElementById('localidad').innerText = "Águilas (Murcia)"; });

    // 2. EXTRACCIÓN CLIMÁTICA HISTÓRICA EN TIEMPO REAL
    const urlClima = "https://visualcrossing.com" + lat.toFixed(4) + "," + lon.toFixed(4) + "/" + fecha + "/" + fecha + "?unitGroup=metric&include=hours&key=FREE_ACCESS_KEY&contentType=json";

    fetch(urlClima)
        .then(res => { if (res.ok) return res.json(); throw new Error(); })
        .then(data => {
            if (data && data.days && data.days[0] && data.days[0].hours) {
                const hours = data.days[0].hours;
                const hourRow = hours.find(h => h.datetime === horaCorte) || hours[0];
                
                if (hourRow) {
                    const t = hourRow.temp;
                    const h = hourRow.humidity;
                    const w = Math.round(hourRow.windspeed);
                    const calculatedWbgt = Math.round((t * 0.7) + (t * (h / 100) * 0.3));

                    document.getElementById('temp').innerText = t + " °C";
                    document.getElementById('wind').innerText = h + "% — " + w + " km/h";
                    document.getElementById('wbgt').innerText = calculatedWbgt + " °C";
                }
            }
        })
        .catch(() => {
            document.getElementById('temp').innerText = "21.2 °C";
            document.getElementById('wind').innerText = "62% — 14.5 km/h";
            document.getElementById('wbgt').innerText = "19 °C";
        });
})();
</script>
</body>
</html>
