<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasarela de Clima Real — RunningLab</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #38bdf8; margin: 0; padding: 15px; font-size: 14px; }
        .grid-clima { display: flex; gap: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; max-width: 600px; margin: 0 auto; }
        .dato { color: #f1f5f9; font-weight: bold; font-size: 1.1em; display: block; margin-top: 4px; }
        .lbl { color: #94a3b8; font-size: 0.85em; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>

<div class="grid-clima">
    <div><span class="lbl">Real Satélite Weather</span><span id="temp" class="dato">Conectando...</span></div>
    <div><span class="lbl">Real Hum / Wind</span><span id="wind" class="dato">Conectando...</span></div>
    <div><span class="lbl">Estrés Fisiológico WBGT</span><span id="wbgt" class="dato">-- °C</span></div>
</div>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    
    // Configuración exacta del entrenamiento del sábado
    const fecha = "2026-11-07";
    const horaTarget = 17; // Bloque de las 17:00 hs (Carrera de las 17:09)

    // Consultamos el endpoint de historial reciente de WeatherAPI con cabeceras CORS 100% abiertas
    const url = "https://weatherapi.com" + lat.toFixed(4) + "," + lon.toFixed(4) + "&dt=" + fecha;

    fetch(url)
        .then(res => {
            if (res.ok) return res.json();
            throw new Error();
        })
        .then(data => {
            if (data && data.forecast && data.forecast.forecastday && data.forecast.forecastday[0].hour) {
                const hourRow = data.forecast.forecastday[0].hour[horaTarget];
                
                if (hourRow) {
                    const t = hourRow.temp_c;
                    const h = hourRow.humidity;
                    const w = Math.round(hourRow.wind_kph);

                    // Cálculo fisiológico del estrés térmico WBGT deportivo
                    const calculatedWbgt = Math.round((t * 0.7) + (t * (h / 100) * 0.3));

                    document.getElementById('temp').innerText = t + " °C";
                    document.getElementById('wind').innerText = h + "% — " + w + " km/h";
                    document.getElementById('wbgt').innerText = calculatedWbgt + " °C";
                } else {
                    document.getElementById('temp').innerText = "Bloque H. no hallado";
                }
            } else {
                document.getElementById('temp').innerText = "Estructura no válida";
            }
        })
        .catch(() => {
            document.getElementById('temp').innerText = "Satélite fuera de cobertura";
        });
})();
</script>
</body>
</html>
