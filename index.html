<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Depurador de Telemetría Real por Satélite</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #34d399; padding: 25px; font-size: 14px; line-height: 1.6; }
        pre { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; color: #f1f5f9; overflow-x: auto; }
    </style>
</head>
<body>

<h3>📡 Datos del Satélite Recuperados en Directo de Internet:</h3>
<pre id="pantalla">Cargando telemetría real desde internet...</pre>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";

    const horaCorte = hora.substring(0, 2) + ":00"; 
    let resultado = { error: false, municipio: "Zona Rural", provincia: "España", temp: "--", hum: "--", wind: "--", wbgt: "--" };

    // Constructor de URL nativo para evitar corrupciones de texto o bloqueos de parseo
    const urlClima = new URL("https://open-meteo.com");
    urlClima.searchParams.append("latitude", lat.toFixed(4));
    urlClima.searchParams.append("longitude", lon.toFixed(4));
    urlMeteo.searchParams.append("start_date", fecha);
    urlMeteo.searchParams.append("end_date", fecha);
    urlMeteo.searchParams.append("hourly", "temperature_2m,relative_humidity_2m,wind_speed_10m");
    urlMeteo.searchParams.append("timezone", "Europe/Madrid");

    const urlGeo = new URL("https://open-meteo.com");
    urlGeo.searchParams.append("latitude", lat.toFixed(4));
    urlGeo.searchParams.append("longitude", lon.toFixed(4));
    urlGeo.searchParams.append("language", "es");
    urlGeo.searchParams.append("format", "json");

    fetch(urlGeo.toString())
        .then(res => res.json())
        .then(geoData => {
            if (geoData && geoData.results && geoData.results.length > 0) {
                resultado.municipio = geoData.results[0].name || "Zona Rural";
                resultado.provincia = geoData.results[0].admin1 || "España";
            }
            return fetch(urlClima.toString());
        })
        .then(res => {
            if (!res.ok) throw new Error("Código de respuesta de satélite: " + res.status);
            return res.json();
        })
        .then(data => {
            if (data && data.hourly && data.hourly.time) {
                const targetTimestamp = fecha + "T" + horaCorte;
                const idx = data.hourly.time.indexOf(targetTimestamp);
                
                if (idx !== -1) {
                    resultado.temp = data.hourly.temperature_2m[idx];
                    resultado.hum = data.hourly.relative_humidity_2m[idx];
                    resultado.wind = Math.round(data.hourly.wind_speed_10m[idx] * 10) / 10;
                    resultado.wbgt = Math.round((resultado.temp * 0.7) + (resultado.temp * (resultado.hum / 100) * 0.3));
                }
            }
            
            document.getElementById('pantalla').innerText = JSON.stringify(resultado, null, 4);
            window.parent.postMessage(resultado, "*");
        })
        .catch(err => {
            document.getElementById('pantalla').innerText = "Fallo de comunicación: " + err.message;
            window.parent.postMessage({ error: true, mensaje: err.message }, "*");
        });
})();
</script>
</body>
</html>
