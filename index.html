<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat'));
    const lon = parseFloat(params.get('lon'));
    const fecha = params.get('fecha');
    const hora = params.get('hora');

    if (!lat || !lon || !fecha || !hora) {
        window.parent.postMessage({ error: true, mensaje: "Faltan parámetros en el TCX" }, "*");
        return;
    }

    const horaCorte = hora.substring(0, 2) + ":00:00"; 
    let resultado = { error: false, municipio: "", provincia: "", temp: "", hum: "", wind: "", wbgt: "" };

    // 1. Consulta Geográfica del Municipio por Coordenadas reales de internet
    const urlGeo = `https://open-meteo.com{lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=&hourly=&local_meteo_id=open-meteo-geocoding`;
    
    // Usamos el endpoint de archivo histórico oficial para recuperar los datos reales de internet de la fecha del TCX
    const urlClima = `https://open-meteo.com{lat.toFixed(4)}&longitude=${lon.toFixed(4)}&start_date=${fecha}&end_date=${fecha}&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=Europe%2FMadrid`;

    // Intentamos recuperar la geolocalización inversa real
    fetch(`https://openstreetmap.org{lat}&lon=${lon}&zoom=10&addressdetails=1`)
        .then(res => res.json())
        .then(geo => {
            if (geo && geo.address) {
                resultado.municipio = geo.address.city || geo.address.town || geo.address.village || geo.address.county || "Zona Rural";
                resultado.provincia = geo.address.province || geo.address.state || "";
            }
            return fetch(urlClima);
        })
        .then(res => {
            if (!res.ok) throw new Error("Error en respuesta de satélite");
            return res.json();
        })
        .then(data => {
            if (data && data.hourly && data.hourly.time) {
                const idx = data.hourly.time.indexOf(fecha + "T" + hora.substring(0, 2) + ":00");
                if (idx !== -1) {
                    resultado.temp = data.hourly.temperature_2m[idx];
                    resultado.hum = data.hourly.relative_humidity_2m[idx];
                    resultado.wind = Math.round(data.hourly.wind_speed_10m[idx]);
                    resultado.wbgt = Math.round((resultado.temp * 0.7) + (resultado.temp * (resultado.hum / 100) * 0.3));
                    
                    window.parent.postMessage(resultado, "*");
                } else {
                    throw new Error("Bloque horario no consolidado");
                }
            } else {
                throw new Error("Estructura inválida");
            }
        })
        .catch(err => {
            window.parent.postMessage({ error: true, mensaje: err.message }, "*");
        });
})();
</script>
</body>
</html>
