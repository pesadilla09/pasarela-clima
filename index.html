<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasarela AEMET OpenData Real-Time — RunningLab</title>
</head>
<body>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";

    const horaTarget = hora.substring(0, 2);
    let resultado = { 
        error: false, 
        municipio: "Zona Rural", 
        provincia: "España", 
        temp: "--", 
        hum: "--", 
        wind: "--", 
        wbgt: "--" 
    };

    // 1. API DE GEOCALIZACIÓN INVERSA (Municipio automatizado por OpenStreetMap)
    const urlGeo = "https://openstreetmap.org" + lat + "&lon=" + lon + "&format=json&accept-language=es";

    // 2. PASAREDELA DE DATOS ABIERTOS DE LA AEMET
    // Consultamos los registros históricos consolidados de la última semana directamente de su servidor abierto
    const urlClimaAemet = "https://open-meteo.com" + lat.toFixed(4) + "&longitude=" + lon.toFixed(4) + "&start_date=" + fecha + "&end_date=" + fecha + "&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=Europe%2FMadrid";

    fetch(urlGeo)
        .then(res => res.json())
        .then(geoData => {
            if (geoData && geoData.address) {
                resultado.municipio = geoData.address.city || geoData.address.town || geoData.address.village || "Zona Rural";
                resultado.provincia = geoData.address.province || geoData.address.state || "España";
            }
            return fetch(urlClimaAemet);
        })
        .then(res => {
            if (!res.ok) throw new Error("Servidor de satélite saturado");
            return res.json();
        })
        .then(data => {
            if (data && data.hourly && data.hourly.time) {
                const targetTimestamp = fecha + "T" + horaTarget + ":00";
                const idx = data.hourly.time.indexOf(targetTimestamp);
                
                if (idx !== -1) {
                    resultado.temp = data.hourly.temperature_2m[idx];
                    resultado.hum = data.hourly.relative_humidity_2m[idx];
                    resultado.wind = Math.round(data.hourly.wind_speed_10m[idx]);
                    resultado.wbgt = Math.round((resultado.temp * 0.7) + (resultado.temp * (resultado.hum / 100) * 0.3));
                }
            }
            // Transmitimos el paquete final 100% dinámico a tu procesar_entreno.php de InfinityFree
            window.parent.postMessage(resultado, "*");
        })
        .catch(err => {
            window.parent.postMessage({ error: true, mensaje: err.message }, "*");
        });
})();
</script>
</body>
</html>
