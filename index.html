<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasarela de Clima Real — RunningLab</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #38bdf8; margin: 0; padding: 20px; font-size: 14px; }
        .grid-clima { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; max-width: 700px; margin: 0 auto; }
        .forma-box { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .forma-box span { display: block; color: #94a3b8; font-size: 0.85em; text-transform: uppercase; font-weight: bold; }
        .forma-box strong { display: block; color: #f8fafc; font-size: 1.25em; margin-top: 4px; font-weight: 600; }
        .success-text { color: #34d399 !important; }
    </style>
</head>
<body>

<div class="grid-clima">
    <div class="forma-box"><span>📍 Ubicación Satélite</span><strong id="localidad" class="success-text">Buscando...</strong></div>
    <div class="forma-box"><span>Real Satélite Weather</span><strong id="temp">Conectando...</strong></div>
    <div class="forma-box"><span>Real Hum / Wind</span><strong id="wind">Conectando...</strong></div>
    <div class="forma-box"><span>Estrés Fisiológico WBGT</span><strong id="wbgt">-- °C</strong></div>
</div>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = params.get('lat') || "37.4030";
    const lon = params.get('lon') || "-1.5830";
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";

    // Llamamos a nuestra propia función backend de Vercel libre de bloqueos de red
    fetch(`/api/clima?lat=${lat}&lon=${lon}&fecha=${fecha}&hora=${hora}`)
        .then(res => res.json())
        .then(clima => {
            if (clima) {
                document.getElementById('localidad').innerText = clima.municipio + (clima.provincia ? " (" + clima.provincia + ")" : "");
                document.getElementById('temp').innerText = clima.temp + " °C";
                document.getElementById('wind').innerText = clima.hum + "% — " + clima.wind + " km/h";
                document.getElementById('wbgt').innerText = clima.wbgt + " °C";
                
                // Transmitimos de forma asíncrona a InfinityFree
                window.parent.postMessage(clima, "*");
            }
        })
        .catch(() => {
            document.getElementById('temp').innerText = "Reconectando satélite...";
        });
})();
</script>
</body>
</html>
