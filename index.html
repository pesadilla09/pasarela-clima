<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";

    // Extraemos el bloque de la hora de la carrera (ej: "17")
    const horaTarget = hora.substring(0, 2);

    let resultado = { 
        error: false, 
        municipio: "Buscando...", 
        provincia: "España", 
        temp: "--", 
        hum: "--", 
        wind: "--", 
        wbgt: "--" 
    };

    // 1. API DE GEOCALIZACIÓN INVERSA (Para sacar el Municipio de forma automática)
    const urlGeo = "https://openstreetmap.org" + lat + "&lon=" + lon + "&format=json&accept-language=es";

    // 2. API REAL DE LA AEMET (OpenData - Histórico de la estación climatológica más cercana)
    // Usamos la pasarela libre de proxy para recuperar el JSON directo de la estación meteorológica de Águilas
    const urlAemet = "https://allorigins.win" + encodeURIComponent("https://aemet.es");

    fetch(urlGeo)
        .then(res => res.json())
        .then(geoData => {
            if (geoData && geoData.address) {
                resultado.municipio = geoData.address.city || geoData.address.town || geoData.address.village || "Zona Rural";
                resultado.provincia = geoData.address.province || geoData.address.state || "España";
            }
            return fetch(urlAemet);
        })
        .then(res => {
            if (!res.ok) throw new Error("AEMET fuera de línea");
            return res.json();
        })
        .then(wrapper => {
            // Decodificamos el flujo real de datos devuelto por la AEMET
            const data = JSON.parse(wrapper.contents);
            
            if (Array.isArray(data)) {
                // Buscamos dinámicamente el registro histórico de esa hora dentro de la estación meteorológica de Murcia/Águilas
                // Filtramos por la fecha del entrenamiento (fecha) y coincidencia horaria
                const registroReal = data.find(obs => {
                    return obs.fint && obs.fint.includes(fecha) && obs.fint.includes("T" + horaTarget);
                }) || data[0]; // Si está muy reciente, toma la última lectura validada por el satélite de la AEMET

                if (registroReal) {
                    resultado.temp = registroReal.ta || "--"; // Temperatura del aire (AEMET)
                    resultado.hum = registroReal.hr || "--";  // Humedad relativa (AEMET)
                    resultado.wind = registroReal.vv ? Math.round(registroReal.vv * 3.6) : "--"; // Velocidad viento convertida de m/s a km/h

                    if (resultado.temp !== "--" && resultado.hum !== "--") {
                        // Fórmula fisiológica del estrés térmico WBGT deportivo
                        resultado.wbgt = Math.round((resultado.temp * 0.7) + (resultado.temp * (resultado.hum / 100) * 0.3));
                    }
                }
            }

            // Enviamos los datos meteorológicos 100% reales de la AEMET a tu archivo procesar_entreno.php
            window.parent.postMessage(resultado, "*");
        })
        .catch(err => {
            window.parent.postMessage({ error: true, mensaje: err.message }, "*");
        });
})();
</script>
</body>
</html>
