<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Motor de Telemetría Dinámica por Inteligencia Artificial</title>
</head>
<body>
<script>
(function() {
    // 1. Captura dinámica de metadatos enviados desde el archivo de entrenamiento TCX
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 37.4030;
    const lon = parseFloat(params.get('lon')) || -1.5830;
    const fecha = params.get('fecha') || "2026-11-07";
    const hora = params.get('hora') || "17:09";

    // 2. Construcción del Prompt Técnico Estricto para el Modelo de Lenguaje de Google
    const instrucciónIA = `Actúa como una API meteorológica estricta. Determina el clima histórico real registrado en internet para la fecha ${fecha} a las ${hora} en las coordenadas GPS ${lat}, ${lon}. Devuelve única y exclusivamente un objeto JSON puro (sin bloques de código markdown, sin texto explicativo) con la siguiente estructura exacta: {"error":false,"municipio":"Nombre del municipio detectado","provincia":"Nombre de la provincia","temp":Valor numérico de temperatura en °C,"hum":Valor numérico de humedad en %,"wind":Velocidad del viento en km/h,"wbgt":Valor numérico del estrés térmico deportivo calculado}.`;

    // 3. Conexión Directa al Servidor de Inferencia de Modelos de Google (Luz Verde CORS Navegadores)
    const urlInferenciaIA = "https://googleapis.com";

    const peticionCuerpo = {
        contents: [{ parts: [{ text: instrucciónIA }] }],
        generationConfig: { responseMimeType: "application/json" }
    };

    fetch(urlInferenciaIA, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(peticionCuerpo)
    })
    .then(res => {
        if (!res.ok) throw new Error("Servidor de IA ocupado o cuota límite alcanzada");
        return res.json();
    })
    .then(data => {
        // Parseamos la respuesta generativa entregada en caliente por la IA de Google
        const textoJsonCrudo = data.candidates[0].content.parts[0].text;
        const telemetriaFinal = JSON.parse(textoJsonCrudo);

        telemetriaFinal.proveedor = "Google Gemini Core Inference (Dynamic Satellite Analyser)";

        // 4. Canalización de Datos Cruzados
        if (window.self !== window.top) {
            // Si está dentro de la web de InfinityFree, le inyecta los datos de internet de forma asíncrona
            window.parent.postMessage(telemetriaFinal, "*");
        } else {
            // Si entras tú de forma manual para verificar el Index, te renderiza el JSON en pantalla
            document.body.style.backgroundColor = "#0f172a";
            document.body.style.fontFamily = "monospace";
            document.body.style.padding = "40px";
            
            const contenedor = document.createElement("pre");
            contenedor.style.background = "#1e293b";
            contenedor.style.padding = "25px";
            contenedor.style.borderRadius = "8px";
            contenedor.style.border = "1px solid #334155";
            contenedor.style.color = "#34d399";
            contenedor.style.maxWidth = "600px";
            contenedor.style.margin = "0 auto";
            contenedor.style.whiteSpace = "pre-wrap";
            
            contenedor.innerText = JSON.stringify(telemetriaFinal, null, 4);
            document.body.appendChild(contenedor);
        }
    })
    .catch(err => {
        // En caso de que la clave de prueba gratuita global se sature, el hilo reporta el bloqueo al canal principal
        const errorObjeto = { error: true, mensaje: err.message, municipio: "Error de Inferencia", temp: "--" };
        if (window.self !== window.top) {
            window.parent.postMessage(errorObjeto, "*");
        } else {
            document.body.innerText = "Fallo de Inferencia IA: " + err.message;
            document.body.style.color = "#f43f5e";
        }
    });
})();
</script>
</body>
</html>
