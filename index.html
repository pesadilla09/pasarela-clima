<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat'));
    const lon = parseFloat(params.get('lon'));
    const fecha = params.get('fecha');
    const hora = params.get('hora');

    if (!lat || !lon || !fecha || !hora) {
        window.parent.postMessage({ error: true, mensaje: "Faltan parámetros en el TCX" }, "*");
        return;
    }

    const horaCorte = hora.substring(0, 2) + ":00:00"; 
    let resultado = { error: false, municipio: "Zona Rural", provincia: "España", temp: "--", hum: "--", wind: "--", wbgt: "--" };

    const urlClima = "https://open-meteo.com" + lat.toFixed(4) + "&longitude=" + lon.toFixed(4) + "&start_date=" + fecha + "&end_date=" + fecha + "&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=Europe%2FMadrid";
    const urlGeo = "https://open-meteo.com" + lat.toFixed(4) + "&longitude=" + lon.toFixed(4) + "&language=es&format=json";

    fetch(urlGeo)
        .then(res => res.json())
        .then(geoData => {
            if (geoData && geoData.results && geoData.results.length > 0) {
                resultado.municipio = geoData.results[0].name || "Zona Rural";
                resultado.provincia = geoData.results[0].admin1 || "España";
            }
            return fetch(urlClima);
        })
        .then(res => {
            if (!res.ok) throw new Error("Error en respuesta de satélite");
            return res.json();
        })
        .then(data => {
            if (data && data.hourly && data.hourly.time) {
                const targetTimestamp = fecha + "T" + horaCorte.substring(0, 5);
                const idx = data.hourly.time.indexOf(targetTimestamp);
                
                if (idx !== -1) {
                    resultado.temp = data.hourly.temperature_2m[idx];
                    resultado.hum = data.hourly.relative_humidity_2m[idx];
                    resultado.wind = Math.round(data.hourly.wind_speed_10m[idx]);
                    resultado.wbgt = Math.round((resultado.temp * 0.7) + (resultado.temp * (resultado.hum / 100) * 0.3));
                }
            }
            window.parent.postMessage(resultado, "*");
        })
        .catch(err => {
            window.parent.postMessage({ error: true, mensaje: err.message }, "*");
        });
})();
</script>
</body>
</html>
